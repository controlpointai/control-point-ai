backend:
  name: github
  repo: controlpointai/control-point-ai
  branch: main
  base_url: https://controlpointai-services.controlpointai-wayne-2026.workers.dev
  auth_endpoint: auth

local_backend: true

publish_mode: editorial_workflow
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

site_url: "https://controlpointai-site-2026.web.app"
display_url: "https://controlpointai-site-2026.web.app"
logo_url: "/assets/images/controlpointai-admin-logo-transparent.png"

collections:
  - name: "insights"
    label: "Insights"
    label_singular: "Insight"
    folder: "content/insights"
    create: true
    slug: "{{fields.id}}"
    summary: "{{fields.label}} - {{title}}"
    preview_path: "insights/post/index.html?issue={{fields.id}}"
    sortable_fields: ["order", "publish_date", "title", "topic"]
    fields:
      - { label: "Post ID", name: "id", widget: "string", hint: "Use a short unique ID, such as ai11. This permanent internal ID is used for tracking and redirects; readers see a human-readable URL." }
      - { label: "Order", name: "order", widget: "number", value_type: "int", min: 1, hint: "Use the issue number. The archive sorts newest first by default." }
      - { label: "Label", name: "label", widget: "string", default: "Issue 11" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "publish_date", widget: "datetime", required: false, hint: "Optional. Future-dated posts stay hidden until a scheduled deploy runs after this time." }
      - label: "Topic"
        name: "topic"
        widget: "select"
        options:
          - { label: "Runtime authority", value: "runtime" }
          - { label: "Operations", value: "operations" }
          - { label: "Analysis", value: "analysis" }
          - { label: "Interface", value: "interface" }
      - { label: "Featured Image", name: "image", widget: "image", required: false, default: "/assets/images/uploads/newsletter-authority-engineering.jpg" }
      - { label: "Summary", name: "summary", widget: "text", hint: "Buyer-facing archive summary. Keep this concise." }
      - { label: "Body", name: "body", widget: "markdown" }

      # generated-insight-seo-fields:start
      - { label: "Author", name: "author", widget: "string", default: "Wayne Couch", hint: "Visible byline and article metadata. Change this for an individual article when appropriate." }
      - { label: "Updated Date Override", name: "updated_date", widget: "datetime", required: false, hint: "Optional. Leave blank to use the latest repository change date automatically." }
      - label: "URL Generation"
        name: "slug_mode"
        widget: "select"
        default: "automatic"
        hint: "Why it matters: a short readable URL helps people understand and share the page. Automatic creates it from the title."
        options:
          - { label: "Automatic from title (recommended)", value: "automatic" }
          - { label: "Use a custom URL slug", value: "custom" }
      - { label: "Custom URL Slug", name: "slug", widget: "string", required: false, hint: "Only used in custom mode. Enter the final part, such as ai-approval-revalidation. Earlier URLs are preserved as redirects." }
      - label: "Search Title Generation"
        name: "meta_title_mode"
        widget: "select"
        default: "automatic"
        hint: "Why it matters: the search title helps a reader decide whether the page answers the question. Automatic uses the article title and adds the brand when it fits."
        options:
          - { label: "Automatic from article title (recommended)", value: "automatic" }
          - { label: "Use a custom search title", value: "custom" }
      - { label: "Custom Search Title", name: "meta_title", widget: "string", required: false, hint: "Only used in custom mode. Keep it accurate and specific; do not list or repeat keywords." }
      - label: "Search Description Generation"
        name: "meta_description_mode"
        widget: "select"
        default: "automatic"
        hint: "Why it matters: the description can explain the value of the page in search results. Automatic uses and safely shortens the summary."
        options:
          - { label: "Automatic from summary (recommended)", value: "automatic" }
          - { label: "Use a custom search description", value: "custom" }
      - { label: "Custom Search Description", name: "meta_description", widget: "text", required: false, hint: "Only used in custom mode. Describe what the reader will learn in one or two natural sentences." }
      - label: "Related Insights"
        name: "related_insight_ids"
        widget: "relation"
        collection: "insights"
        search_fields: ["title", "label", "id"]
        value_field: "id"
        display_fields: ["title", "label"]
        multiple: true
        required: false
        hint: "Why it matters: useful internal links help readers and search engines find connected work. Leave blank for automatic same-topic suggestions, or select up to three."
      - label: "Related Service"
        name: "related_service"
        widget: "select"
        default: "ai-data-flow-mapping"
        options:
          - { label: "AI Data Flow Mapping", value: "ai-data-flow-mapping" }
          - { label: "Control Point Placement", value: "control-point-placement" }
          - { label: "Executive & Technical Authority Advisory", value: "authority-advisory" }
      - label: "Call to Action"
        name: "cta"
        widget: "select"
        default: "request-data-flow-mapping"
        options:
          - { label: "Request Data Flow Mapping (recommended)", value: "request-data-flow-mapping" }
          - { label: "Explore Services", value: "explore-services" }
          - { label: "Review Case Studies", value: "review-case-studies" }
          - { label: "Contact ControlPointAI", value: "contact-controlpointai" }
          - { label: "No call to action", value: "none" }
      - label: "Sources and Further Reading"
        name: "sources"
        widget: "list"
        required: false
        hint: "Why it matters: authoritative sources make technical claims easier to verify. Use: Source name | https://example.com/page."
        field: { label: "Source", name: "source", widget: "string" }
      - label: "Previous URL Slugs"
        name: "redirect_from"
        widget: "list"
        required: false
        hint: "Normally automatic. Use only to preserve another known old URL; enter just the old slug."
        field: { label: "Old Slug", name: "old_slug", widget: "string" }
      # generated-insight-seo-fields:end

  - name: "case_studies"
    label: "Case Studies"
    label_singular: "Case Study"
    folder: "content/case-studies"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    preview_path: "case-studies/{{fields.live_path}}/index.html"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Live Page Path", name: "live_path", widget: "string", required: false, hint: "Public URL folder under /case-studies/. Existing examples: runtime-authority-enforcement, unauthorized-concept-drift, context-disruption-ui-intervention." }
      - { label: "Sort Order", name: "order", widget: "number", value_type: "int", min: 1, required: false, hint: "Controls the order on the Case Studies index and previous/next links." }
      - label: "Page Layout"
        name: "layout"
        widget: "select"
        default: "article"
        hint: "Use Report / PDF-style when the web page should feel like the formatted PDF instead of a plain article."
        options:
          - { label: "Article", value: "article" }
          - { label: "Report / PDF-style", value: "report" }
      - { label: "Eyebrow / Category", name: "eyebrow", widget: "string", required: false, hint: "Shown above the case-study title and as the card badge on the index." }
      - label: "Badge Color"
        name: "badge_variant"
        widget: "select"
        required: false
        default: ""
        options:
          - { label: "Default blue", value: "" }
          - { label: "Amber", value: "amber" }
          - { label: "Red", value: "red" }
      - { label: "Card Image", name: "card_image", widget: "image", required: false, default: "/assets/images/uploads/newsletter-control-point-authority.jpg" }
      - label: "Visibility on Case Studies Tab"
        name: "status"
        widget: "select"
        default: "featured"
        hint: "This is separate from Decap's Unpublished Entries workflow. After you click Publish, Featured appears on the public Case Studies tab; Draft keeps the direct page available but hides it from the index."
        options:
          - { label: "Featured - show on Case Studies tab", value: "featured" }
          - { label: "Draft - hide from Case Studies tab", value: "draft" }
          - { label: "Archived - hide from Case Studies tab", value: "archived" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "SEO Title", name: "meta_title", widget: "string", required: false, hint: "Optional browser/search title. Defaults to the case-study title." }
      - { label: "SEO Description", name: "meta_description", widget: "text", required: false, hint: "Optional search description. Defaults to the summary." }
      - { label: "Failure Pattern", name: "failure_pattern", widget: "string", required: false }
      - { label: "What ControlPointAI Would Map", name: "mapping_focus", widget: "text", required: false }
      - label: "Index Themes"
        name: "themes"
        widget: "list"
        required: false
        hint: "Short phrases shown on the Case Studies index card."
        field: { label: "Theme", name: "theme", widget: "string" }
      - label: "Key Principles"
        name: "key_principles"
        widget: "list"
        required: false
        hint: "Bullets for the Key Principles sidebar on the public case-study page."
        field: { label: "Principle", name: "principle", widget: "string" }
      - label: "Formatted PDF"
        name: "pdf_path"
        widget: "file"
        required: false
        media_folder: "/assets/documents"
        public_folder: "/assets/documents"
        hint: "Upload the polished PDF here; the report layout will add Download PDF buttons automatically."
      - { label: "Report Label", name: "report_label", widget: "string", required: false, hint: "Used in the small report header line, for example RX Maintenance Case Study." }
      - { label: "Document Status", name: "document_status", widget: "string", required: false, hint: "Used on report pages, for example Reissued August 2026." }
      - { label: "Document Notice", name: "document_notice", widget: "string", required: false, hint: "Short sidebar status note, for example Public-source / synthetic case study." }
      - { label: "Classification Heading", name: "classification_heading", widget: "string", required: false, hint: "Report cover notice heading." }
      - { label: "Classification Note", name: "classification_note", widget: "text", required: false, hint: "Report cover notice body." }
      - { label: "Source URL", name: "source_url", widget: "string", required: false, hint: "Optional external source link, such as the original LinkedIn post." }
      # generated-case-related-insights:start
      - label: "Related Insights"
        name: "related_insight_ids"
        widget: "relation"
        collection: "insights"
        search_fields: ["title", "label", "id"]
        value_field: "id"
        display_fields: ["title", "label"]
        multiple: true
        required: false
        hint: "Why it matters: relevant internal links help readers continue from evidence to the underlying method. Leave blank for procedural selection, or choose up to three."
      # generated-case-related-insights:end
      - { label: "Body", name: "body", widget: "markdown", hint: "For report pages, the first two lines before the first heading become the baseline and date. Use ## for report panels, > for blue callouts, and Markdown tables for bordered report tables." }

  # generated-site-seo-collection:start
  - name: "site_seo"
    label: "Site SEO"
    description: "Guided search and sharing settings for the main site pages. Canonicals, robots rules, schema, sitemaps, and redirects remain automatic."
    files:
      - label: "Organization and Defaults"
        name: "organization"
        file: "content/site-seo/organization.json"
        format: "json"
        fields:
          - { label: "Organization Name", name: "name", widget: "string", default: "ControlPointAI" }
          - { label: "Organization Description", name: "description", widget: "text", hint: "Why it matters: a clear, consistent description helps search and sharing systems understand what the organization does." }
          - { label: "Logo", name: "logo", widget: "image", required: false, hint: "Uses an existing brand asset in organization metadata. A new image is not required." }
          - { label: "Default Author", name: "default_author", widget: "string", default: "Wayne Couch" }
          - label: "Official Profile URLs"
            name: "same_as"
            widget: "list"
            required: false
            hint: "Optional. Add only official profiles controlled by ControlPointAI."
            field: { label: "URL", name: "url", widget: "string" }
      - label: "Homepage SEO"
        name: "homepage"
        file: "content/site-seo/homepage.json"
        format: "json"
        fields: &page_seo_fields
          - label: "Search Title Generation"
            name: "title_mode"
            widget: "select"
            default: "automatic"
            hint: "Why it matters: the search title tells readers what the page offers. Automatic keeps the current page title; Custom uses your override."
            options:
              - { label: "Automatic from the page (recommended)", value: "automatic" }
              - { label: "Use a custom search title", value: "custom" }
          - { label: "Custom Search Title", name: "meta_title", widget: "string", required: false, hint: "Used only in Custom mode. Keep it accurate and specific rather than listing keywords." }
          - label: "Search Description Generation"
            name: "description_mode"
            widget: "select"
            default: "automatic"
            hint: "Why it matters: this summary may be shown in search results. Automatic keeps the current description; Custom uses your override."
            options:
              - { label: "Automatic from the page (recommended)", value: "automatic" }
              - { label: "Use a custom search description", value: "custom" }
          - { label: "Custom Search Description", name: "meta_description", widget: "text", required: false, hint: "Used only in Custom mode. Explain what the reader will find in one or two natural sentences." }
          - label: "Social Title Generation"
            name: "social_title_mode"
            widget: "select"
            default: "automatic"
            hint: "Automatic reuses the search title when the page is shared."
            options:
              - { label: "Automatic from search title (recommended)", value: "automatic" }
              - { label: "Use a custom social title", value: "custom" }
          - { label: "Custom Social Title", name: "social_title", widget: "string", required: false }
          - label: "Social Description Generation"
            name: "social_description_mode"
            widget: "select"
            default: "automatic"
            hint: "Automatic reuses the search description when the page is shared."
            options:
              - { label: "Automatic from search description (recommended)", value: "automatic" }
              - { label: "Use a custom social description", value: "custom" }
          - { label: "Custom Social Description", name: "social_description", widget: "text", required: false }
          - { label: "Social Sharing Image", name: "social_image", widget: "image", required: false, hint: "Optional. Select an existing relevant asset; a new image is not required." }
          - { label: "Primary Audience Note", name: "primary_audience", widget: "string", required: false, hint: "Planning aid only: who most needs this page? This is not inserted as a keyword field." }
          - { label: "Reader Question or Need", name: "reader_need", widget: "text", required: false, hint: "Planning aid only: what question should this page answer?" }
          - { label: "Primary Topic Phrase", name: "primary_topic", widget: "string", required: false, hint: "Planning aid only: use one natural phrase a real reader might use. Do not repeat it unnaturally." }
          - label: "Related Insights"
            name: "related_insight_ids"
            widget: "relation"
            collection: "insights"
            search_fields: ["title", "label", "id"]
            value_field: "id"
            display_fields: ["title", "label"]
            multiple: true
            required: false
            hint: "Leave blank for procedurally selected related articles, or choose up to three manually."
      - label: "Services Page SEO"
        name: "services"
        file: "content/site-seo/services.json"
        format: "json"
        fields: *page_seo_fields
      - label: "Method Page SEO"
        name: "method"
        file: "content/site-seo/method.json"
        format: "json"
        fields: *page_seo_fields
      - label: "Case Studies Index SEO"
        name: "case_studies"
        file: "content/site-seo/case-studies.json"
        format: "json"
        fields: *page_seo_fields
      - label: "Insights Index SEO"
        name: "insights"
        file: "content/site-seo/insights.json"
        format: "json"
        fields: *page_seo_fields
      - label: "Contact Page SEO"
        name: "contact"
        file: "content/site-seo/contact.json"
        format: "json"
        fields: *page_seo_fields
  # generated-site-seo-collection:end
