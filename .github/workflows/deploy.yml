name: Deploy site to Firebase Hosting
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: controlpointai-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, validate, and prepare hosting bundle
        env:
          SITE_URL: https://controlpointai.org
        run: npm run build:hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONTROLPOINTAI_SITE_2026 }}"
          channelId: live
          projectId: controlpointai-site-2026
      - name: Smoke-test production
        env:
          SITE_URL: https://controlpointai-site-2026.web.app
          LEGACY_INSIGHT_ID: ai9
        run: npm run audit:live
